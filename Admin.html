<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Cut Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 20px;
        }

        .box {
            max-width: 500px;
            margin: 40px auto;
            background: #1b1b1b;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #f5b400;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 6px;
            border: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #f5b400;
            border: none;
            border-radius: 7px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Fresh Cut Admin</h1>

        <label>Service Name</label>
        <input type="text" placeholder="Haircut">

        <label>Price</label>
        <input type="number" placeholder="2000">

        <label>WhatsApp Number</label>
        <input type="text" placeholder="2348000000000">

        <button>Save Changes</button>

    </div>

</body>
</html>
