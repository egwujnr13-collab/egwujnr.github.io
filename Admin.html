<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Cut Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 20px;
        }

        .box {
            max-width: 500px;
            margin: 40px auto;
            background: #1b1b1b;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #f5b400;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #f5b400;
            border: none;
            border-radius: 7px;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Fresh Cut Admin</h1>

    <label>Service Name</label>
    <input id="serviceName" type="text" value="Haircut">

    <label>Price (₦)</label>
    <input id="servicePrice" type="number" value="2000">

    <button onclick="saveService()">Save Changes</button>

    <div id="message"></div>

</div>

<script>
function saveService() {

    const name = document.getElementById("serviceName").value;
    const price = document.getElementById("servicePrice").value;

    localStorage.setItem("serviceName", name);
    localStorage.setItem("servicePrice", price);

    document.getElementById("message").innerText =
        "✅ Changes saved!";
}
</script>

</body>
        </html>
